---
# Copia questo file in secrets.yml e mettici i valori reali:
#
#   cp secrets.example.yml secrets.yml
#
# secrets.yml e' ignorato da git: i segreti non finiscono mai nella cronologia.

# Shared secret RADIUS degli hotspot (deve coincidere con il NAS in OpenWISP RADIUS)
vault_radius_secret: "CHANGEME"

# Password della casella controller@ninux-nnxx.it (relay SMTP su mail.ninux-nnxx.it)
vault_smtp_password: "CHANGEME"

# Password dell'utente PostgreSQL openwisp2 (database di OpenWISP e freeradius)
vault_postgresql_password: "CHANGEME"

# Chiave SAE della mesh 802.11s (variabile mesh_password del template mesh in OpenWISP)
mesh_password: "CHANGEME"
