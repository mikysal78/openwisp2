---
name: "NINUX Basilicata"
slug: "basilicata"

settings:
  mobile_phone_verification: false
  subscriptions: false

# configuration variables for the server app
server:
  # put the URL of openwisp-radius here
  host: "https://openwisp.ninux-nnxx.it"
  uuid: 3a6e98ba-c021-41eb-be44-65a8130e6aec
  secret_key: CHANGEME
  timeout: 2 #request timeout period in seconds

# configuration variables for the client
# Path of all the assets should be defined relative to the organization's folder
# in assets directory.
client:

  auto_login: True

  # path of favicon
  favicon: "favicon.png"

  # path of the custom css file or files relative to organization's
  # folder in assets directory.
  css:
    - "index.css"
  js:
    - "index.js"
  languages:
    - text: "english"
      slug: "en"
    - text: "italian"
      slug: "it"
  default_language: "en"
  components:
    header:
      logo:
        url: "openwisp-logo-black.svg" # logo url
        alternate_text: "openwisp"
      links:
        - text:
            en: "Sign In"
          url: "/{orgSlug}/login"
          authenticated: false
        - text:
            en: "Sign Up"
          url: "/{orgSlug}/registration"
          authenticated: false
        - text:
            en: "Change password"
          url: "/{orgSlug}/change-password"
          authenticated: true
          methods_excluded:
            - saml
            - social_login

    footer:
      links:
        - text:
            en: "WebSite"
            it: "Sito Web"
          url: "https://ninux-nnxx.it"
          authenticated: false
        - text:
            en: "WebSite"
            it: "Sito Web"
          url: "https://ninux-nnxx.it"
          authenticated: true
          verified: false
        - text:
            en: "WebSite"
            it: "Sito Web"
          url: "https://ninux-nnxx.it"
          authenticated: true
          verified: true
      after_html:
        en: '&copy; <a href="https://ninux-nnxx.it">NINUX Basilicata</a> &middot; ninux-nnxx.it'
        it: '&copy; <a href="https://ninux-nnxx.it">NINUX Basilicata</a> &middot; ninux-nnxx.it'

    registration_form:
      auto_select_first_plan: false
      input_fields:
        phone_number: {}
        username:
          pattern: '[a-zA-Z@.+\-_\d]{1,150}'
        email:
          pattern: '.+@.+\..+'
        password:
          pattern: ".{6,}"
        password_confirm:
          pattern: ".{6,}"
        first_name:
          setting: "disabled"
        last_name:
          setting: "disabled"
        birth_date:
          setting: "disabled"
        location:
          pattern: '[a-zA-Z@.+\-_\d]{1,150}'
          setting: "disabled"
        country:
          pattern: '[a-zA-Z@.+\-_\d\s]{1,150}'
        zipcode: {}
        street: {}
        city: {}
        tax_number:
          pattern: '[a-zA-Z@.+\-_\d]{1,150}'
      additional_info_text: true
      links:
        login: true

    password_reset_form:
      additional_text: true
      input_fields:
        email:
          pattern: '.+@.+\..+'
      contact_text: true
      login_page_link: true

    password_reset_confirm_form:
      additional_text: true
      input_fields:
        password:
          pattern: ".{6,}"
        password_confirm:
          pattern: ".{6,}"
      contact_text: true
      login_page_link: true

    contact_page:
      email: "support@openwisp.co"
      helpdesk: "+789 948 564"
      social_links:
        - alt:
            en: "twitter"
          icon: "twitter.svg"
          url: "https://twitter.com/openwisp"
        - alt:
            en: "facebook"
          icon: "facebook.svg"
          url: "https://facebook.com/openwisp"
      after_html:
        en: '<div class="sponsor">Supported by<br><a href="https://romaclubmatera.it" target="_blank" rel="noopener"><img src="/assets/basilicata/romaclubmatera-logo.png" alt="Roma Club Matera" height="80"></a></div>'
        it: '<div class="sponsor">Con il sostegno di<br><a href="https://romaclubmatera.it" target="_blank" rel="noopener"><img src="/assets/basilicata/romaclubmatera-logo.png" alt="Roma Club Matera" height="80"></a></div>'

    status_page:
      links:
        - text:
            en: "Change your password"
          url: "/{orgSlug}/change-password/"
      accounting_swap_octets: false
      radius_usage_enabled: true

    login_form:
      social_login:
        links:
          - text:
              en: "Login with Google"
            icon: "google.svg"
            url: "https://openwisp.ninux-nnxx.it/accounts/google/login/?next=%2Fradius%2Fsocial-login%2Fbasilicata%2F%3Fcp%3Dhttps%3A%2F%2Fwifi.ninux-nnxx.it%2Fbasilicata%2Flogin%2F%26last%3D"
          # X: da aggiungere se il piano gratuito delle API lo consente
      input_fields:
        username:
          # email (account registrati, Google) o nome utente (voucher di openwisp-voucher)
          type: "text"
          pattern: '[a-zA-Z@.+\-_\d]{1,150}'
          label:
            en: "Email or username"
            it: "Email o nome utente"
          placeholder:
            en: "email or username"
            it: "email o nome utente"
          pattern_description:
            en: "letters, digits and @ . + - _"
            it: "lettere, cifre e @ . + - _"
        password:
          pattern: ".{6,}"
        remember_me:
          value: true
      additional_info_text: true
      buttons:
        register: true
      links:
        forget_password: true

    password_change_form:
      input_fields:
        password1:
          pattern: ".{6,}"
        password2:
          pattern: ".{6,}"

    404_page:
      heading: true
      sub_heading: true
      message: true
      homepage_link: true

    captive_portal_sync_auth: false

    captive_portal_login_form:
      method: post
      action: http://192.168.182.1:3990/logon
      fields:
        username: auth_user
        password: auth_pass
      macaddr_param_name: macaddr
      additional_fields:
        - name: zone
          value: zone_name
        - name: redirurl
          value: https://wifi.ninux-nnxx.it/basilicata/status
        - name: accept
          value: accept

    captive_portal_logout_form:
      method: post
      action: http://192.168.182.1:3990/logoff
      fields:
        id: logout_id
      additional_fields: []
      logout_by_session: true
      wait_after: 3000

  privacy_policy:
    en: "privacy-en.md"
    it: "privacy-it.md"
  terms_and_conditions:
    en: "terms-en.md"
    it: "terms-it.md"
