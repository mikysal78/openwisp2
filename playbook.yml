---
# ============================================================================
# Play 1 — OpenWISP2 "full" (tutti i moduli) + WiFi Login Pages
# ============================================================================
- name: Installa OpenWISP2 full e WiFi Login Pages
  hosts: openwisp2
  become: "{{ become | default('yes') }}"
  vars_files:
    - secrets.yml
  pre_tasks:
    # Il ruolo wifi_login_pages clona/aggiorna il repo come root, ma i file
    # appartengono a www-data: senza safe.directory git rifiuta di operare
    # ("dubious ownership").
    - name: Git safe.directory per il repo wifi-login-pages
      ansible.builtin.shell: |
        git config --global --get-all safe.directory 2>/dev/null | grep -qx '/opt/openwisp2/wifi-login-pages' \
          || git config --global --add safe.directory /opt/openwisp2/wifi-login-pages
      changed_when: false

    # I dati del monitoring (InfluxDB) crescono nel tempo: li spostiamo sul
    # secondo disco (20G montato su /opt) con un bind mount, visto che il
    # ruolo non permette di cambiare la data dir.
    - name: Verifica se /var/lib/influxdb è già un bind mount
      ansible.builtin.command: findmnt /var/lib/influxdb
      register: influxdb_mount
      failed_when: false
      changed_when: false
      tags: [storage]

    - name: Sposta i dati InfluxDB su /opt (secondo disco)
      when: influxdb_mount.rc != 0
      tags: [storage]
      block:
        - name: Ferma influxdb se già installato
          ansible.builtin.systemd:
            name: influxdb
            state: stopped
          failed_when: false

        - name: Crea /opt/influxdb
          ansible.builtin.file:
            path: /opt/influxdb
            state: directory

        - name: Migra eventuali dati esistenti
          ansible.builtin.shell: |
            if [ -d /var/lib/influxdb ] && [ -n "$(ls -A /var/lib/influxdb 2>/dev/null)" ]; then
              cp -a /var/lib/influxdb/. /opt/influxdb/
            fi
          changed_when: false

        - name: Assicura la directory /var/lib/influxdb
          ansible.builtin.file:
            path: /var/lib/influxdb
            state: directory

        - name: Bind mount /opt/influxdb -> /var/lib/influxdb (persistente in fstab)
          ansible.posix.mount:
            path: /var/lib/influxdb
            src: /opt/influxdb
            fstype: none
            opts: bind
            state: mounted

        - name: Riavvia influxdb se installato
          ansible.builtin.systemd:
            name: influxdb
            state: started
          failed_when: false

    # PostgreSQL + PostGIS al posto di SQLite: con SQLite i tanti scrittori
    # concorrenti (uwsgi, daphne, worker celery, cron, freeradius) davano
    # "database is locked" e il task celery che aggiorna i checksum delle
    # config falliva. Il ruolo installa solo il driver: server, utente, database
    # ed estensione postgis li prepariamo qui. Il passaggio di Django e
    # freeradius al nuovo database lo decide ninux_postgresql (vedi vars); la
    # copia dei dati da SQLite si fa a mano, a servizi fermi (scripts/).
    - name: Installa PostgreSQL e PostGIS
      ansible.builtin.apt:
        name:
          - postgresql
          - postgresql-17-postgis-3
          - python3-psycopg2      # per i moduli community.postgresql
          - acl                   # per become_user: postgres
      tags: [postgresql]

    - name: Avvia PostgreSQL (su Debian ascolta solo su localhost)
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: true
      # in check mode PostgreSQL potrebbe non essere ancora installato
      ignore_errors: "{{ ansible_check_mode }}"
      tags: [postgresql]

    - name: Utente PostgreSQL di OpenWISP
      community.postgresql.postgresql_user:
        name: "{{ ninux_postgresql_database.user }}"
        password: "{{ ninux_postgresql_database.password }}"
      become_user: postgres
      # in check mode PostgreSQL potrebbe non essere ancora installato
      ignore_errors: "{{ ansible_check_mode }}"
      tags: [postgresql]

    - name: Database PostgreSQL di OpenWISP
      community.postgresql.postgresql_db:
        name: "{{ ninux_postgresql_database.name }}"
        owner: "{{ ninux_postgresql_database.user }}"
        encoding: UTF-8
        template: template0
      become_user: postgres
      # in check mode PostgreSQL potrebbe non essere ancora installato
      ignore_errors: "{{ ansible_check_mode }}"
      tags: [postgresql]

    - name: Estensione postgis nel database di OpenWISP
      community.postgresql.postgresql_ext:
        name: postgis
        login_db: "{{ ninux_postgresql_database.name }}"
      become_user: postgres
      # in check mode PostgreSQL potrebbe non essere ancora installato
      ignore_errors: "{{ ansible_check_mode }}"
      tags: [postgresql]
  roles:
    - openwisp.openwisp2
    - openwisp.wifi_login_pages
  post_tasks:
    # Il ruolo scrive solo NETJSONCONFIG_CONTEXT, ma openwisp-controller legge
    # OPENWISP_CONTROLLER_CONTEXT: lo aggiungiamo in coda a settings.py.
    # Serve come valore di ripiego per le variabili della regola di subnet
    # division (il template mesh non validerebbe con la variabile non risolta);
    # per ogni device la regola assegna l'IP vero e sovrascrive questo valore.
    - name: Context globale per openwisp-controller
      ansible.builtin.blockinfile:
        path: "{{ openwisp2_path }}/openwisp2/settings.py"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - controller context"
        block: |
          OPENWISP_CONTROLLER_CONTEXT = {{ openwisp2_context | to_nice_json }}
      notify: restart openwisp2
      tags: [context]

    # freeradius (rlm_rest) e le WiFi Login Pages chiamano l'API OpenWISP via i
    # domini pubblici. Se questi risolvono all'IP pubblico, la sorgente delle
    # richieste risulta l'IP pubblico (es. l'IPv6 ::18) e la difesa
    # OPENWISP_RADIUS_FREERADIUS_ALLOWED_HOSTS (default 127.0.0.1) le rifiuta con
    # 403. Mappiamo i domini su loopback: le chiamate a sé stesso restano su
    # 127.0.0.1 (il cert *.ninux-nnxx.it è comunque valido, l'Host non cambia).
    - name: "/etc/hosts - domini OpenWISP/WiFi su loopback"
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.0\.1\s'
        line: "127.0.0.1\tlocalhost {{ inventory_hostname }} {{ wifi_login_pages_domains | join(' ') }}"
      notify: Restart freeradius
      tags: [etchost]

    - name: "/etc/hosts - rimuovi i mapping dei domini su IP non-loopback"
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "^(?!127\\.0\\.0\\.1|::1)\\S+\\s+.*{{ inventory_hostname | regex_escape }}"
        state: absent
      notify: Restart freeradius
      tags: [etchost]

    # OpenWISP crea gli IP in IPAM senza nome del device (bulk_create, nessun
    # segnale): questo script fa il sync e lo eseguiamo periodicamente.
    - name: Script di sync hostname -> IPAM
      ansible.builtin.copy:
        src: files/sync_ipam_hostnames.py
        dest: "{{ openwisp2_path }}/sync_ipam_hostnames.py"
        mode: "0644"
      tags: [ipam]

    - name: Cron per il sync hostname in IPAM (ogni 10 minuti)
      ansible.builtin.cron:
        name: "sync hostname IPAM"
        minute: "*/10"
        job: >-
          {{ openwisp2_path }}/env/bin/python {{ openwisp2_path }}/manage.py shell
          < {{ openwisp2_path }}/sync_ipam_hostnames.py > /dev/null 2>&1
      tags: [ipam]

    # Template "Nomi dei nodi (hosts)": nome dei nodi per i loro IP (mesh,
    # ZeroTier, br-lan) e per i MAC della mesh, generato dai dati di
    # monitoraggio; sulla mesh altrimenti si vedono solo indirizzi. Lo script
    # salva il template solo se il contenuto cambia.
    - name: Script del template "Nomi dei nodi (hosts)"
      ansible.builtin.copy:
        src: files/sync_node_hosts.py
        dest: "{{ openwisp2_path }}/sync_node_hosts.py"
        mode: "0644"
      tags: [hosts]

    # Minuti sfasati rispetto agli altri cron (tutti su multipli di 5): con
    # SQLite le scritture concorrenti danno "database is locked", il task
    # celery che aggiorna i checksum fallisce e i router appena flashati
    # restano in loop su "Configuration checksum mismatch".
    - name: Cron per il template "Nomi dei nodi (hosts)" (ogni 15 minuti)
      ansible.builtin.cron:
        name: "sync nomi dei nodi (hosts)"
        minute: "7,22,37,52"
        job: >-
          {{ openwisp2_path }}/env/bin/python {{ openwisp2_path }}/manage.py shell
          < {{ openwisp2_path }}/sync_node_hosts.py > /dev/null 2>&1
      tags: [hosts]

    # Network Topology: le topology ZeroTier (parser ZeroTierParser, strategy
    # receive) vengono alimentate interrogando il controller ZeroTier locale
    # (l'auth al controller è locale, mentre il fetch di OpenWISP non la gestisce).
    # L'oggetto Topology si crea in admin; qui teniamo il feed periodico.
    - name: Script feed topology ZeroTier
      ansible.builtin.copy:
        src: files/topology_zerotier_feed.py
        dest: "{{ openwisp2_path }}/topology_zerotier_feed.py"
        mode: "0644"
      tags: [topology]

    - name: Cron feed topology ZeroTier (ogni 5 minuti)
      ansible.builtin.cron:
        name: "feed topology ZeroTier"
        minute: "*/5"
        job: >-
          {{ openwisp2_path }}/env/bin/python {{ openwisp2_path }}/manage.py shell
          < {{ openwisp2_path }}/topology_zerotier_feed.py > /dev/null 2>&1
      tags: [topology]

    # Topology "Babel NINUX" (parser NetJsonParser, strategy receive): netdiff
    # non ha un parser Babel/BIRD e Babel non dà la topologia intera da un solo
    # nodo, quindi lo script legge 'birdc show babel ...' sul server e via SSH
    # su ogni router e unisce le tabelle dei vicini in un NetworkGraph.
    # L'oggetto Topology si crea in admin (label "Babel NINUX").
    - name: Script feed topology Babel
      ansible.builtin.copy:
        src: files/topology_babel_feed.py
        dest: "{{ openwisp2_path }}/topology_babel_feed.py"
        mode: "0644"
      tags: [topology]

    - name: Cron feed topology Babel (ogni 5 minuti)
      ansible.builtin.cron:
        name: "feed topology Babel"
        minute: "*/5"
        job: >-
          {{ openwisp2_path }}/env/bin/python {{ openwisp2_path }}/manage.py shell
          < {{ openwisp2_path }}/topology_babel_feed.py > /dev/null 2>&1
      tags: [topology]

    # Visualizzatore delle topology con i link colorati per tipo (cavo, radio,
    # VPN): override di netjsongraph/netjsongraph-script.html nella DIRS dei
    # template del progetto, che il loader legge prima delle app. È una copia
    # del template di openwisp-network-topology 1.3: va riallineata agli upgrade.
    - name: Cartella dei template Django del progetto
      ansible.builtin.file:
        path: "{{ openwisp2_path }}/templates/netjsongraph"
        state: directory
        mode: "0755"
      tags: [topology]

    - name: Template del visualizzatore topology (link colorati per tipo)
      ansible.builtin.copy:
        src: files/django-templates/netjsongraph/netjsongraph-script.html
        dest: "{{ openwisp2_path }}/templates/netjsongraph/netjsongraph-script.html"
        mode: "0644"
      notify: restart openwisp2
      tags: [topology]

    # Al boot supervisor (uwsgi/celery) parte in parallelo a InfluxDB, che
    # impiega una decina di secondi ad aprire gli shard. openwisp-monitoring
    # chiama create_database() dentro AppConfig.ready(): se InfluxDB non
    # risponde ancora, l'app Django non si carica e uwsgi resta su a rispondere
    # 500 a ogni richiesta, per sempre, finché non lo si riavvia a mano.
    # influxdb.service è Type=forking e il suo script di avvio esce solo quando
    # l'API HTTP risponde, quindi After= basta a garantire l'ordine.
    - name: Directory per il drop-in di supervisor
      ansible.builtin.file:
        path: /etc/systemd/system/supervisor.service.d
        state: directory
        mode: "0755"
      tags: [systemd]

    - name: Ordine di avvio - supervisor dopo InfluxDB e Redis
      ansible.builtin.copy:
        dest: /etc/systemd/system/supervisor.service.d/10-openwisp-deps.conf
        mode: "0644"
        content: |
          # ANSIBLE MANAGED - vedi playbook.yml
          [Unit]
          Wants=influxdb.service redis-server.service
          After=influxdb.service redis-server.service
      register: supervisor_dropin
      tags: [systemd]

    - name: Ricarica systemd dopo il drop-in
      ansible.builtin.systemd:
        daemon_reload: true
      when: supervisor_dropin.changed
      tags: [systemd]

    # NB (storico, risolto lato Proxmox): eth0 ed eth1 dichiaravano ENTRAMBE una
    # default gateway. ifup configurava eth0 per prima, poi la default di eth1
    # falliva ("RTNETLINK answers: File exists") e ifup marcava TUTTA eth1 come
    # fallita: non finiva in /run/network/ifstate, ifupdown-wait-online la
    # aspettava per 300s e nginx/influxdb/supervisor restavano in coda dietro
    # network-online.target — dopo uno stop/start della CT il sito era
    # irraggiungibile per 5 minuti. Risolto togliendo gw= da net0 (eth0) nella
    # config della CT su Proxmox: la default ora è quella pubblica su eth1.
    # Qui non tocchiamo /etc/network/interfaces: nei CT Proxmox lo rigenera
    # l'host a ogni start, qualsiasi modifica locale verrebbe persa.

    # Rete di sicurezza: se per qualsiasi motivo un'interfaccia non venisse
    # registrata (es. Proxmox rigenera interfaces con la doppia gateway), il
    # boot si ferma comunque solo 15s invece di 300.
    - name: Timeout basso per ifupdown-wait-online
      ansible.builtin.lineinfile:
        path: /etc/default/networking
        regexp: '^#?\s*WAIT_ONLINE_TIMEOUT='
        line: "WAIT_ONLINE_TIMEOUT=15"
      tags: [network]

    # systemd-networkd non gestisce nessuna interfaccia (le eth sono di
    # ifupdown, zt* di zerotier-one), ma il suo wait-online è abilitato e
    # blocca network-online.target per 120s prima di fallire: da solo era
    # i due terzi del tempo di boot.
    - name: Disattiva systemd-networkd-wait-online (nessuna interfaccia gestita da networkd)
      ansible.builtin.systemd:
        name: systemd-networkd-wait-online.service
        enabled: false
        masked: true
      tags: [network]

    # La default route ora esce dal gateway pubblico su ens19 (simmetrica con il
    # traffico in ingresso verso 194.28.98.61). Prima la default era 10.27.22.5
    # e copriva per caduta TUTTA la rete ninux: le subnet 10.27.x che Babel non
    # annuncia finirebbero ora al gateway pubblico, che le scarta. Rimettiamo
    # quella raggiungibilità come rotta specifica: le rotte Babel (/24) restano
    # più specifiche e continuano a vincere su questa /16.
    # Non è in /etc/network/interfaces perché Proxmox lo rigenera a ogni start
    # della CT. bird non la ridistribuisce: il protocol kernel ha import reject.
    - name: Rotta statica verso la rete NINUX via ens18
      ansible.builtin.copy:
        dest: /etc/systemd/system/ninux-route.service
        mode: "0644"
        content: |
          # ANSIBLE MANAGED - vedi playbook.yml
          [Unit]
          Description=Rotta statica verso la rete NINUX ({{ ninux_network }}) via {{ ninux_gw_interface }}
          After=networking.service
          Wants=networking.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/sbin/ip route replace {{ ninux_network }} via {{ ninux_gateway }} dev {{ ninux_gw_interface }}
          ExecStop=/sbin/ip route del {{ ninux_network }} via {{ ninux_gateway }} dev {{ ninux_gw_interface }}

          [Install]
          WantedBy=multi-user.target
      register: ninux_route_unit
      tags: [network]

    - name: Abilita e avvia la rotta statica NINUX
      ansible.builtin.systemd:
        name: ninux-route.service
        enabled: true
        state: "{{ 'restarted' if ninux_route_unit.changed else 'started' }}"
        daemon_reload: true
      tags: [network]

  handlers:
    - name: restart openwisp2
      ansible.builtin.command: supervisorctl restart openwisp2 celery celerybeat
      changed_when: true

  vars:
    # ------------------------------------------------------------------
    # Email — NB: il dominio di OpenWISP è l'inventory_hostname nel file
    # "hosts" (openwisp.ninux-nnxx.it): il ruolo lo usa per nginx e Django.
    # ------------------------------------------------------------------
    # ------------------------------------------------------------------
    # Rete: la default route esce dal gateway pubblico su ens19; la rete
    # ninux resta raggiungibile via ens18 con una rotta specifica.
    # ------------------------------------------------------------------
    ninux_network: "10.27.0.0/16"
    ninux_gateway: "10.27.22.5"
    ninux_gw_interface: "ens18"

    openwisp2_default_from_email: "NINUX OpenWISP <controller@ninux-nnxx.it>"
    openwisp2_email_host: "localhost"
    # Stouts.postfix (dipendenza del ruolo) scrive in main.cf il booleano così
    # com'è ("smtp_use_tls = True"), che postfix rifiuta: il client smtp esce
    # con "bad boolean configuration" e nessuna mail parte. Serve la stringa.
    postfix_smtp_use_tls: "yes"
    # Le mail escono dal mail server del dominio (autorizzato da SPF e con
    # DKIM), autenticandosi come controller@: l'IP del CT non è nell'SPF di
    # ninux-nnxx.it e Gmail le rifiuterebbe (550 5.7.26). Il mittente viene
    # riscritto in controller@ anche per le mail di sistema (root, cron), perché
    # il relay accetta solo l'indirizzo della casella autenticata.
    postfix_smtp_sasl_auth_enable_override: true
    postfix_relayhost: "[mail.ninux-nnxx.it]:587"
    postfix_smtp_sasl_user: "controller@ninux-nnxx.it"
    postfix_smtp_sasl_password: "{{ vault_smtp_password }}"
    postfix_rewrite_sender_address: "controller@ninux-nnxx.it"

    # ------------------------------------------------------------------
    # Installazione "full": abilita tutti i moduli
    # (controller e monitoring sono già inclusi di default)
    # ------------------------------------------------------------------
    openwisp2_network_topology: true
    openwisp2_firmware_upgrader: true
    openwisp2_radius: true          # necessario anche per le WiFi Login Pages
    openwisp2_monitoring: true

    # ------------------------------------------------------------------
    # Database: con ninux_postgresql false resta SQLite (default del ruolo);
    # true passa Django e freeradius (rlm_sql_postgresql) a PostgreSQL.
    # Prima di metterlo a true va fatta la copia dei dati, vedi
    # scripts/migra-postgresql.sh. Connessione TCP su localhost perché
    # freeradius non usa il socket unix.
    # ------------------------------------------------------------------
    ninux_postgresql: false
    ninux_postgresql_database:
      engine: "django.contrib.gis.db.backends.postgis"
      name: "openwisp2"
      user: "openwisp2"
      password: "{{ vault_postgresql_password }}"
      host: "localhost"
      port: "5432"
      options: {}
    ninux_sqlite_database:
      engine: "openwisp_utils.db.backends.spatialite"
      name: "{{ openwisp2_path }}/db.sqlite3"
      user: ""
      password: ""
      host: ""
      port: ""
      options:
        timeout: 10
    openwisp2_database: "{{ ninux_postgresql_database if ninux_postgresql | bool else ninux_sqlite_database }}"

    # Immagini OpenWrt custom (build NinuxOpenwrt) esposte dal firmware upgrader:
    # associano ogni file sysupgrade ai modelli di board che lo accettano, cosi'
    # l'admin puo' caricarle come "Firmware Image" per la categoria giusta.
    openwisp2_extra_django_settings_instructions:
      - |
        OPENWISP_CUSTOM_OPENWRT_IMAGES = (
            ("ramips-mt7621-totolink_x5000r-squashfs-sysupgrade.bin", {
                "label": "TOTOLINK X5000R",
                "boards": ("TOTOLINK X5000R",),
            }),
            ("ipq806x-generic-tplink_c2600-squashfs-sysupgrade.bin", {
                "label": "TP-Link Archer C2600",
                "boards": ("TP-Link Archer C2600 v1", "TP-Link Archer C2600"),
            }),
            ("mediatek-filogic-zyxel_nwa50ax-pro-squashfs-sysupgrade.bin", {
                "label": "Zyxel NWA50AX Pro",
                "boards": ("Zyxel NWA50AX Pro",),
            }),
            ("x86-64-generic-squashfs-combined-efi.img.gz", {
                "label": "Generic x86/64",
                "boards": ("x86_64_efi", "x86_64", "Default string Default string"),
            }),
        )
      # Il ruolo scrive il context globale come NETJSONCONFIG_CONTEXT, ma questa
      # versione di OpenWISP legge OPENWISP_CONTROLLER_CONTEXT: senza questo alias
      # il context di default è vuoto e alla REGISTRAZIONE i template con
      # {{ mesh_subnet1_ip1 }} / {{ radius_secret }} non validano (HTTP 400).
      - |
        OPENWISP_CONTROLLER_CONTEXT = NETJSONCONFIG_CONTEXT

    # Subnet Division: assegna automaticamente un IP dall'IPAM a ogni device
    # (è l'"autoip" nativo di OpenWISP, usato dal template mesh)
    # Integrazione topology <-> device: lega i nodi delle topology ai device
    # (ZeroTier via member id, NetJSON/Babel via id "<MAC>@babel") e, al cambio
    # di stato di un link, fa ripartire i check del monitoring.
    openwisp2_extra_django_apps:
      - "openwisp_controller.subnet_division"
      - "openwisp_network_topology.integrations.device"

    # Context globale: valore di ripiego per le variabili generate dalla regola
    # di subnet division "mesh". Serve solo a far validare il template quando la
    # variabile non è ancora risolta; per ogni device la regola assegna l'IP vero
    # e lo sovrascrive (il context della regola è applicato DOPO quello globale).
    # NB: non va messo nei "default values" del template, altrimenti l'admin lo
    # copierebbe nelle variabili del device, vincendo sull'assegnazione automatica.
    openwisp2_context:
      mesh_subnet1_ip1: "10.27.99.1"
      mesh_prefixlen: "24"
      # NB: wan_interface NON sta qui. La WAN (stub OSPF) cambia da router a router
      # (eth1, eth0, wan, ...), quindi è un default_value del template "Bird2 Babel"
      # (default eth1, copiato nelle variabili del device alla registrazione e
      # sovrascrivibile per-device). Un default globale la forzerebbe uguale per
      # tutti, rompendo i router con WAN diversa.
      # Shared secret RADIUS degli hotspot: sta in secrets.yml, cosi' i template
      # hotspot nel repo non contengono il segreto in chiaro.
      radius_secret: "{{ vault_radius_secret }}"

    # ------------------------------------------------------------------
    # SSL — certificato gestito MANUALMENTE (già presente sul CT).
    # I file esistono già, quindi il ruolo NON genera il self-signed
    # e non li toccherà mai: li rinnovi tu in /etc/ssl/acme/.
    # ------------------------------------------------------------------
    openwisp2_path: "/opt/openwisp2"
    openwisp2_ssl_cert: "/etc/ssl/acme/ninux-nnxx.it.fullchain.pem"
    openwisp2_ssl_key: "/etc/ssl/acme/ninux-nnxx.it.key"
    # Il dominio ha un record AAAA: senza questo, sulle connessioni IPv6
    # risponderebbe il vhost delle wifi login pages ([::]:443) al posto di
    # OpenWISP (che di default ascolta solo IPv4)
    openwisp2_nginx_ipv6: true

    # La riga 127.0.0.1 di /etc/hosts la gestiamo noi nei post_tasks (mappa sia il
    # dominio OpenWISP sia quello WiFi su loopback): disabilitiamo la task del
    # ruolo per non entrare in tug-of-war su quella riga.
    openwisp2_inventory_hostname_localhost: false

    # ------------------------------------------------------------------
    # WiFi Login Pages (captive portal) — stesso certificato
    # (deve coprire wifi.ninux-nnxx.it: wildcard o SAN)
    # ------------------------------------------------------------------
    wifi_login_pages_domains:
      - "wifi.ninux-nnxx.it"
    wifi_login_pages_ssl_cert: "{{ openwisp2_ssl_cert }}"
    wifi_login_pages_ssl_key: "{{ openwisp2_ssl_key }}"
    # Directory locale con i file di configurazione delle organizzazioni
    wifi_login_pages_organizations_src: "owlp_organizations/"

# ============================================================================
# Play 2 — Controller ZeroTier self-hosted
#
# OpenWISP gestisce la rete ZeroTier via API locale del servizio ZeroTier
# (127.0.0.1:9993). Qui installiamo zerotier-one sulla CT e lo lasciamo girare
# come nodo/controller. Dopo il play, in OpenWISP si crea l'oggetto VPN backend
# ZeroTier:
#   Host  = 127.0.0.1:9993   (controller locale, stesso host di OpenWISP)
#   Token = contenuto di /var/lib/zerotier-one/authtoken.secret
# OpenWISP rileva il node address, crea la rete e la gestisce; l'interfaccia sui
# device diventa owzt<6hex del network id>, su cui gira Babel.
# ============================================================================
- name: Installa il controller ZeroTier self-hosted
  hosts: openwisp2
  become: "{{ become | default('yes') }}"
  tags: zerotier
  tasks:
    - name: Assicura curl (serve allo script di installazione)
      ansible.builtin.apt:
        name: curl
        state: present

    # Lo script ufficiale aggiunge il repo apt firmato e installa zerotier-one;
    # idempotente grazie a `creates`.
    - name: Installa zerotier-one (script ufficiale, verifica GPG)
      ansible.builtin.shell: |
        set -o pipefail
        curl -s https://install.zerotier.com | bash
      args:
        executable: /bin/bash
        creates: /usr/sbin/zerotier-one

    - name: Abilita e avvia zerotier-one
      ansible.builtin.systemd:
        name: zerotier-one
        enabled: true
        state: started

    - name: Attendi che l'API locale di ZeroTier risponda
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 9993
        timeout: 30

    - name: Leggi il node address ZeroTier
      ansible.builtin.command: zerotier-cli -j info
      register: zt_info
      changed_when: false

    - name: Riepilogo per creare l'oggetto VPN ZeroTier in OpenWISP
      ansible.builtin.debug:
        msg:
          - "ZeroTier node address: {{ (zt_info.stdout | from_json).address }}"
          - "In OpenWISP → VPN → Add: backend ZeroTier, Host 127.0.0.1:9993"
          - "AuthToken = contenuto di /var/lib/zerotier-one/authtoken.secret"

# ============================================================================
# Play 3 — Firewall (nftables) + forwarding/NAT per la VPN
# ============================================================================
- name: Configura firewall nftables
  hosts: openwisp2
  become: "{{ become | default('yes') }}"
  tags: firewall
  vars:
    firewall_ssh_port: 2400
    # SSH ammesso solo da queste sorgenti (rete di gestione/mesh).
    # NB: si filtra per IP sorgente e non per interfaccia perché il traffico
    # di gestione arriva anche instradato via Babel su ens19.
    firewall_ssh_sources_v4:
      - "10.27.0.0/16"
    # ens18 = rete di gestione (10.27.22.18)
    firewall_mgmt_interface: "ens18"
    # ens19 = IP pubblico (194.28.98.61 / 2a07:7e81:3f1c::18)
    firewall_wan_interface: "ens19"
    # ZeroTier: control plane + data plane sulla stessa UDP 9993
    firewall_zerotier_port: 9993
    # Interfaccia VPN ZeroTier sul SERVER: zerotier-one la nomina zt<hash>
    # (sui router OpenWrt invece è owzt<id>). Forward router-router.
    firewall_vpn_interface: "zt*"
    # RADIUS raggiungibile solo da VPN e rete di gestione
    firewall_radius_sources_v4:
      - "10.27.255.0/24"
      - "10.27.0.0/16"
    # Raccolta log dei router (Play 5): syslog remoto + netconsole.
    # Le porte devono combaciare con router_logs_*_port del Play 5.
    # Il filtro è per IP sorgente e UDP si falsifica: lo spoofing da Internet
    # va bloccato sul router di confine; qui si limitano sorgenti e frequenza.
    firewall_router_logs_syslog_port: 514
    firewall_router_logs_netconsole_port: 6666
    # Via ZeroTier i router inviano con il proprio IP 10.27.255.x
    firewall_router_logs_vpn_sources_v4:
      - "10.27.255.0/24"
    firewall_router_logs_lan_interfaces:
      - "ens18"
      - "ens19"
    # 194.28.98.57: il router di confine (ReginaMargherita116) raggiunge il
    # server sulla /29 pubblica e invia da lì, non da 10.27.x. Solo quell'IP,
    # non tutta la /29 (lì ci sono le VM pubbliche).
    firewall_router_logs_lan_sources_v4:
      - "10.27.0.0/16"
      - "194.28.98.57"
    # netconsole solo dai router in debug (oggi il solo x86 ReginaMargherita116)
    firewall_router_logs_netconsole_sources_v4:
      - "194.28.98.57"
      - "10.27.22.1"
    # Per singola sorgente: basta per uno stack trace, ferma un flood
    firewall_router_logs_rate: "200/second"
    firewall_router_logs_burst: 2000
    # Interfacce su cui è ammesso Babel (deve combaciare con il play bird):
    # zt* (vicini ZeroTier) + ens19/ens18 (la LAN NINUX: ens18 ed ens19 sono
    # sullo stesso L2, i vicini Babel si vedono su entrambe).
    firewall_babel_interfaces:
      - "zt*"
      - "ens19"
      - "ens18"

  tasks:
    - name: Installa nftables
      ansible.builtin.apt:
        name: nftables
        state: present
        update_cache: true

    - name: Abilita forwarding IPv4 e IPv6 (instradamento router-router via ZeroTier)
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        sysctl_file: /etc/sysctl.d/90-openwisp-forwarding.conf
        reload: true
      loop:
        - net.ipv4.ip_forward
        - net.ipv6.conf.all.forwarding

    - name: Applica la configurazione nftables
      ansible.builtin.template:
        src: templates/nftables.conf.j2
        dest: /etc/nftables.conf
        mode: "0644"
        validate: "nft -c -f %s"
      notify: reload nftables

    - name: Abilita e avvia nftables
      ansible.builtin.systemd:
        name: nftables
        enabled: true
        state: started

  handlers:
    - name: reload nftables
      ansible.builtin.systemd:
        name: nftables
        state: restarted

# ============================================================================
# Play 4 — bird2 (Babel per la rete NINUX)
# La VPN partecipa al routing Babel tramite l'interfaccia ZeroTier del server (zt*).
# ============================================================================
- name: Installa e configura bird2 (Babel)
  hosts: openwisp2
  become: "{{ become | default('yes') }}"
  tags: bird
  vars:
    # Interfaccia da cui ricavare il router id: ens19 (IP pubblico)
    bird_wan_interface: "ens19"
    # Interfaccia ZeroTier: la sua subnet viene annunciata via Babel (direct)
    bird_vpn_interface: "zt*"
    bird_vpn_subnet_v4: "10.27.255.0/24"
    # Interfacce aggiuntive originate come reti CONNESSE in Babel (oltre a zt*):
    # ens18 = LAN di gestione 10.27.22.0/24. Serve perché il server la annunci a
    # metrica ~0 e i router remoti tornino dal server (vedi commento nel template).
    bird_direct_extra_interfaces:
      - "ens18"
    # Interfacce su cui parla Babel: zt* (vicini ZeroTier) + ens19 + ens18 (la LAN
    # NINUX; ens18 ed ens19 condividono l'L2, i vicini si vedono su entrambe).
    bird_babel_interfaces:
      - "zt*"
      - "ens19"
      - "ens18"

  tasks:
    - name: Installa bird2
      ansible.builtin.apt:
        name: bird2
        state: present
        update_cache: true

    - name: Crea il file di log di bird
      ansible.builtin.file:
        path: /var/log/bird.log
        state: touch
        owner: bird
        group: bird
        mode: "0640"
        modification_time: preserve
        access_time: preserve

    - name: Applica la configurazione di bird
      ansible.builtin.template:
        src: templates/bird.conf.j2
        dest: /etc/bird/bird.conf
        owner: bird
        group: bird
        mode: "0640"
        validate: "bird -p -c %s"
      notify: restart bird

    - name: Abilita e avvia bird
      ansible.builtin.systemd:
        name: bird
        enabled: true
        state: started

  handlers:
    - name: restart bird
      ansible.builtin.systemd:
        name: bird
        state: restarted

# ============================================================================
# Play 5 — Raccolta centrale dei log dei router (rsyslog)
# I router inviano il syslog (template OpenWISP "Log remoto") e, quelli in debug,
# netconsole: i log restano sul server anche quando il router si blocca e al
# riavvio perde il buffer in RAM. Le porte vanno aperte nel Play 3.
# ============================================================================
- name: Raccolta log dei router (rsyslog)
  hosts: openwisp2
  become: "{{ become | default('yes') }}"
  tags: router_logs
  vars:
    # Sul secondo disco, come InfluxDB
    router_logs_dir: /opt/router-logs
    router_logs_syslog_port: 514
    router_logs_netconsole_port: 6666
    router_logs_retention_days: 30
    # Oltre questa dimensione il file ruota anche prima del giorno
    router_logs_max_size: 50M

  tasks:
    - name: Installa rsyslog e logrotate
      ansible.builtin.apt:
        name:
          - rsyslog
          - logrotate
        state: present

    - name: Directory dei log dei router
      ansible.builtin.file:
        path: "{{ router_logs_dir }}"
        state: directory
        owner: root
        group: adm
        mode: "0750"

    - name: Configurazione rsyslog per i router
      ansible.builtin.template:
        src: templates/rsyslog-router-logs.conf.j2
        dest: /etc/rsyslog.d/30-router-logs.conf
        mode: "0644"
      notify: restart rsyslog

    - name: Rotazione dei log dei router
      ansible.builtin.template:
        src: templates/logrotate-router-logs.j2
        dest: /etc/logrotate-router-logs.conf
        mode: "0644"

    # La prima versione stava in /etc/logrotate.d (solo rotazione giornaliera)
    - name: Rimuovi la vecchia configurazione di rotazione giornaliera
      ansible.builtin.file:
        path: /etc/logrotate.d/router-logs
        state: absent

    - name: Rotazione oraria dei log dei router (rispetta maxsize)
      ansible.builtin.copy:
        dest: /etc/cron.d/router-logs
        mode: "0644"
        content: |
          # Gestito da Ansible (playbook openwisp2, Play 5): non modificare a mano
          17 * * * * root /usr/sbin/logrotate --state /var/lib/logrotate/router-logs.status /etc/logrotate-router-logs.conf

    - name: Abilita e avvia rsyslog
      ansible.builtin.systemd:
        name: rsyslog
        enabled: true
        state: started

  handlers:
    # Prima di riavviare si valida tutta la configurazione: con un errore
    # rsyslog partirebbe ignorando le regole, anche quelle del server.
    - name: restart rsyslog
      ansible.builtin.shell: rsyslogd -N1 -f /etc/rsyslog.conf && systemctl restart rsyslog
      changed_when: true
